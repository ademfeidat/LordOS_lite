name: Installer MBR parser
on:
  push:
    branches: [compatibility/legacy-bios-mbr]
    paths:
      - "apps/installer/mbrmanualmodel.js"
      - "tests/installer_mbr_manual_model_test.mjs"
      - "server/src/install/mbr.c"
      - "server/src/install/mbr.h"
      - "server/tests/mbr_test.c"
      - "server/src/install/disk_snapshot.c"
      - "server/src/install/disk_snapshot.h"
      - "server/tests/disk_snapshot_test.c"
      - "server/src/install/mbr_manual.c"
      - "server/src/install/mbr_manual.h"
      - "server/src/install/mbr_preflight.c"
      - "server/src/install/mbr_preflight.h"
      - "server/tests/mbr_preflight_test.c"
      - "server/src/install/mbr_mount_plan.c"
      - "server/src/install/mbr_mount_plan.h"
      - "server/tests/mbr_mount_plan_test.c"
      - "server/tests/mbr_manual_test.c"
      - "server/src/install/mbr_disk.c"
      - "server/src/install/mbr_disk.h"
      - "server/tests/mbr_disk_test.c"
      - "server/tests/install_plan_test.c"
      - "server/Makefile"
      - "server/src/install/install.c"
      - ".github/workflows/installer-mbr.yml"
  pull_request:
    paths:
      - "apps/installer/mbrmanualmodel.js"
      - "tests/installer_mbr_manual_model_test.mjs"
      - "server/Makefile"
      - "server/src/install/install.c"
      - "server/src/install/mbr_preflight.c"
      - "server/src/install/mbr_preflight.h"
      - "server/tests/mbr_preflight_test.c"
      - "server/src/install/mbr_mount_plan.c"
      - "server/src/install/mbr_mount_plan.h"
      - "server/tests/mbr_mount_plan_test.c"
      - "server/src/install/mbr.c"
      - "server/src/install/mbr.h"
      - "server/tests/mbr_test.c"
      - "server/src/install/disk_snapshot.c"
      - "server/src/install/disk_snapshot.h"
      - "server/tests/disk_snapshot_test.c"
      - "server/src/install/mbr_manual.c"
      - "server/src/install/mbr_manual.h"
      - "server/tests/mbr_manual_test.c"
      - "server/src/install/mbr_disk.c"
      - "server/src/install/mbr_disk.h"
      - "server/tests/mbr_disk_test.c"
      - "server/tests/install_plan_test.c"
      - ".github/workflows/installer-mbr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mbr-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test isolated MBR manual-selection UI model
        run: node tests/installer_mbr_manual_model_test.mjs
      - name: Compile parser with warnings and sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -Iserver/src -o /tmp/mbr-test \
            server/tests/mbr_test.c server/src/install/mbr.c
      - name: Run read-only parser tests
        run: /tmp/mbr-test
      - name: Compile common snapshot adapter
        run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iserver/src -o /tmp/disk-snapshot-test server/tests/disk_snapshot_test.c server/src/install/disk_snapshot.c
      - name: Run common snapshot tests
        run: /tmp/disk-snapshot-test
      - name: Compile MBR manual-selection validator
        run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iserver/src -o /tmp/mbr-manual-test server/tests/mbr_manual_test.c server/src/install/mbr_manual.c
      - name: Run MBR manual-selection tests
        run: /tmp/mbr-manual-test
      - name: Compile read-only MBR disk probe
        run: cc -std=c11 -D_FILE_OFFSET_BITS=64 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iserver/src -o /tmp/mbr-disk-test server/tests/mbr_disk_test.c server/src/install/mbr_disk.c server/src/install/mbr.c server/src/install/disk_snapshot.c
      - name: Run read-only MBR disk probe tests
        run: /tmp/mbr-disk-test
      - name: Compile read-only MBR preflight tests
        run: cc -std=c11 -D_FILE_OFFSET_BITS=64 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iserver/src -o /tmp/mbr-preflight-test server/tests/mbr_preflight_test.c server/src/install/mbr_preflight.c server/src/install/mbr_manual.c server/src/install/mbr_disk.c server/src/install/mbr.c server/src/install/disk_snapshot.c
      - name: Run read-only MBR preflight tests
        run: /tmp/mbr-preflight-test
      - name: Compile dry-run MBR mount plan tests
        run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iserver/src -o /tmp/mbr-mount-plan-test server/tests/mbr_mount_plan_test.c server/src/install/mbr_mount_plan.c server/src/install/mbr_manual.c
      - name: Run dry-run MBR mount plan tests
        run: /tmp/mbr-mount-plan-test
      - name: Compile installer plan integration tests
        run: make -C server SESSIOND=0 build/install-plan-test
      - name: Run installer plan integration tests
        run: server/build/install-plan-test
