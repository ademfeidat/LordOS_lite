name: Disposable BIOS GRUB write-set audit
on:
  push:
    branches: [compatibility/legacy-bios-mbr]
    paths:
      - "tools/iso/check-grub-mbr-write-set.sh"
      - "tools/iso/build.sh"
      - "tools/installer/audit-grub-mbr-writeset.sh"
      - "tools/installer/parse-grub-write-trace.py"
      - "tests/installer_grub_trace_parser_test.py"
      - ".github/workflows/grub-mbr-writeset-audit.yml"
  pull_request:
    branches: [compatibility/legacy-bios-mbr]
    paths:
      - "tools/iso/check-grub-mbr-write-set.sh"
      - "tools/iso/build.sh"
      - "tools/installer/audit-grub-mbr-writeset.sh"
      - "tools/installer/parse-grub-write-trace.py"
      - "tests/installer_grub_trace_parser_test.py"
      - ".github/workflows/grub-mbr-writeset-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: |
          sh -n tools/iso/build.sh
          sh -n tools/iso/check-grub-mbr-write-set.sh
      - name: Test GRUB trace parser
        run: python3 -m unittest discover -s tests -p 'installer_grub_trace_parser_test.py' -v
      - name: Run audit inside the LordOS Debian 13 build environment
        run: |
          mkdir -p "$RUNNER_TEMP/grub-mbr-audit"
          docker run --pull always --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/grub-mbr-audit:/out" \
            debian:13 bash -euxc '
              apt-get update
              apt-get install -y grub-common grub2-common grub-pc-bin strace fdisk util-linux e2fsprogs python3
              sh /workspace/tools/iso/check-grub-mbr-write-set.sh
              sh /workspace/tools/iso/check-grub-mbr-write-set.sh --verify
              bash /workspace/tools/installer/audit-grub-mbr-writeset.sh /out
            '
      - name: Upload write-set evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grub-mbr-write-set-evidence-debian13
          path: ${{ runner.temp }}/grub-mbr-audit
          if-no-files-found: warn
          retention-days: 30
